name: OpenWrt

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OpenWrt bundle (aarch64-musl)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TARGET: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: openwrt-${{ env.TARGET }}

      # reqwest uses rustls (no OpenSSL); server binary pulls no C deps.
      - name: Install musl cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cross-compile server binary
        run: |
          set -euo pipefail
          test -f webui/index.html
          cross build --release --target "$TARGET" --bin mimo_desktop_bridge

      - name: Stage + strip binary
        id: bin
        run: |
          set -euo pipefail
          mkdir -p openwrt/out
          BIN="target/$TARGET/release/mimo_desktop_bridge"
          cp -f "$BIN" openwrt/out/mimo_desktop_bridge
          docker run --rm -v "$PWD:/w" -w /w \
            ghcr.io/cross-rs/$TARGET:main \
            aarch64-linux-musl-strip openwrt/out/mimo_desktop_bridge \
            || llvm-strip openwrt/out/mimo_desktop_bridge || true
          file openwrt/out/mimo_desktop_bridge || true

      - name: Pack deployable bundle
        run: |
          set -euo pipefail
          NAME="mimo_desktop_bridge_${GITHUB_REF_NAME}_openwrt_aarch64.tar.gz"
          echo "BUNDLE=$NAME" >> "$GITHUB_ENV"
          bash openwrt/pack-bundle.sh openwrt/out/mimo_desktop_bridge "openwrt/out/$NAME"

      # apk-tools v3 (`apk mkpkg`) for OpenWrt 25.12+. Build from Alpine's
      # GitHub mirror; pin commit and verify archive.
      - name: Install apk-tools (mkpkg)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl meson ninja-build libssl-dev zlib1g-dev pkg-config fakeroot
          apk_tools_dir="$(mktemp -d)"
          apk_tools_commit="522171e05c72c8a0dd2a9392f053c89196fbdb9b"
          apk_tools_sha256="4dc7051b7255829eeba77a68a8422889e6e98ffe2cfef50a2a47ef8c0973968c"
          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 180 \
            "https://github.com/alpinelinux/apk-tools/archive/${apk_tools_commit}.tar.gz" \
            -o "$apk_tools_dir/apk-tools.tar.gz"
          echo "$apk_tools_sha256  $apk_tools_dir/apk-tools.tar.gz" | sha256sum -c -
          mkdir "$apk_tools_dir/source"
          tar -xzf "$apk_tools_dir/apk-tools.tar.gz" \
            --strip-components=1 \
            -C "$apk_tools_dir/source"
          meson setup "$apk_tools_dir/build" "$apk_tools_dir/source" \
            -Dminimal=false \
            -Dhelp=disabled \
            -Ddocs=disabled \
            -Dlua=disabled \
            -Dpython=disabled \
            -Dtests=disabled \
            --prefix=/usr/local
          ninja -C "$apk_tools_dir/build"
          sudo ninja -C "$apk_tools_dir/build" install
          sudo ldconfig
          apk --version
          out="$(apk mkpkg 2>&1 || true)"
          echo "$out" | grep -q "required info field"

      - name: Build opkg ipk + apk
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then
            ver="0.0.0_git$(git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          fi
          IPK="luci-app-mimo-desktop-bridge_${ver}-1_aarch64_cortex-a53.ipk"
          APK="luci-app-mimo-desktop-bridge-${ver}-r1.apk"
          echo "IPK=$IPK" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
          PKG_VERSION="$ver" PKG_ARCH="aarch64_cortex-a53" \
            bash openwrt/build-ipk.sh openwrt/out/mimo_desktop_bridge "openwrt/out/$IPK"
          PKG_VERSION="$ver" PKG_RELEASE=1 \
            bash openwrt/build-apk.sh openwrt/out/mimo_desktop_bridge "openwrt/out/$APK"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-aarch64
          path: |
            openwrt/out/${{ env.BUNDLE }}
            openwrt/out/${{ env.IPK }}
            openwrt/out/${{ env.APK }}
          if-no-files-found: error

      - name: Compute date version
        id: ver
        run: echo "date=$(TZ=Asia/Shanghai date +'%y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mimo_desktop_bridge ${{ github.ref_name }} (${{ steps.ver.outputs.date }})"
          body: "Draft release generated by GitHub Actions · build ${{ steps.ver.outputs.date }}. Assets include platform binaries plus the OpenWrt LuCI bundle (tar.gz), opkg .ipk (24.10), and apk .apk (25.12+)."
          draft: true
          prerelease: false
          files: |
            openwrt/out/${{ env.BUNDLE }}
            openwrt/out/${{ env.IPK }}
            openwrt/out/${{ env.APK }}

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-universal
            archive: mimo_desktop_bridge_${{ github.ref_name }}_macos_universal.zip
          - os: windows-2022
            label: windows-x64
            archive: mimo_desktop_bridge_${{ github.ref_name }}_windows_x64.zip
          - os: windows-11-arm
            label: windows-arm64
            archive: mimo_desktop_bridge_${{ github.ref_name }}_windows_arm64.zip
          - os: ubuntu-22.04
            label: linux-x64
            archive: mimo_desktop_bridge_${{ github.ref_name }}_linux_x64.tar.gz
          - os: ubuntu-24.04-arm
            label: linux-arm64
            archive: mimo_desktop_bridge_${{ github.ref_name }}_linux_arm64.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with macOS targets
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build macOS universal binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" --bin mimo_desktop_bridge
          done
          mkdir -p release
          lipo -create \
            target/aarch64-apple-darwin/release/mimo_desktop_bridge \
            target/x86_64-apple-darwin/release/mimo_desktop_bridge \
            -output release/mimo_desktop_bridge
          chmod +x release/mimo_desktop_bridge

      - name: Build Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin mimo_desktop_bridge
          mkdir -p release
          cp target/release/mimo_desktop_bridge release/

      - name: Build Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --bin mimo_desktop_bridge
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/mimo_desktop_bridge.exe release/

      - name: Archive zip
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd release
          7z a "../${{ matrix.archive }}" .

      - name: Archive tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C release .

      - name: Compute date version
        id: ver
        shell: bash
        run: echo "date=$(TZ=Asia/Shanghai date +'%y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Upload draft release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mimo_desktop_bridge ${{ github.ref_name }} (${{ steps.ver.outputs.date }})"
          body: "Draft release generated by GitHub Actions · build ${{ steps.ver.outputs.date }}. Headless server binary (WebUI + OpenAI/Anthropic/Responses)."
          draft: true
          prerelease: false
          files: ${{ matrix.archive }}

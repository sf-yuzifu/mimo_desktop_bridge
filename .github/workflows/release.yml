name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run: full check + build + artifacts, but no release is published.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate: same checks as ci.yml. Everything downstream needs this. ──
  check:
    name: Check (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test
        run: cargo test

  # ── Desktop/server binaries (5 platforms, in parallel with openwrt). ──
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-universal
            archive: mimo_desktop_bridge_${{ github.ref_name }}_macos_universal.zip
          - os: windows-2022
            label: windows-x64
            archive: mimo_desktop_bridge_${{ github.ref_name }}_windows_x64.zip
          - os: windows-11-arm
            label: windows-arm64
            archive: mimo_desktop_bridge_${{ github.ref_name }}_windows_arm64.zip
          - os: ubuntu-22.04
            label: linux-x64
            archive: mimo_desktop_bridge_${{ github.ref_name }}_linux_x64.tar.gz
          - os: ubuntu-24.04-arm
            label: linux-arm64
            archive: mimo_desktop_bridge_${{ github.ref_name }}_linux_arm64.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with macOS targets
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build macOS universal binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" --bin mimo_desktop_bridge
          done
          mkdir -p release
          lipo -create \
            target/aarch64-apple-darwin/release/mimo_desktop_bridge \
            target/x86_64-apple-darwin/release/mimo_desktop_bridge \
            -output release/mimo_desktop_bridge
          chmod +x release/mimo_desktop_bridge

      - name: Build Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin mimo_desktop_bridge
          mkdir -p release
          cp target/release/mimo_desktop_bridge release/

      - name: Build Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --bin mimo_desktop_bridge
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/mimo_desktop_bridge.exe release/

      - name: Archive zip
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd release
          7z a "../${{ matrix.archive }}" .

      - name: Archive tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C release .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ── OpenWrt LuCI bundles (2 arches, in parallel with build). ──
  openwrt:
    name: Build OpenWrt (${{ matrix.label }})
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: aarch64
            target: aarch64-unknown-linux-musl
            pkg_arch: aarch64_cortex-a53
            strip: aarch64-linux-musl-strip
          - label: x86_64
            target: x86_64-unknown-linux-musl
            pkg_arch: x86_64
            strip: x86_64-linux-musl-strip
    env:
      TARGET: ${{ matrix.target }}
      PKG_ARCH: ${{ matrix.pkg_arch }}
      ARCH_LABEL: ${{ matrix.label }}
      STRIP_TOOL: ${{ matrix.strip }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: openwrt-${{ matrix.target }}

      # reqwest uses rustls (no OpenSSL); server binary pulls no C deps.
      - name: Install musl cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cross-compile server binary
        run: |
          set -euo pipefail
          test -f webui/index.html
          cross build --release --target "$TARGET" --bin mimo_desktop_bridge

      - name: Stage + strip binary
        id: bin
        run: |
          set -euo pipefail
          mkdir -p openwrt/out
          BIN="target/$TARGET/release/mimo_desktop_bridge"
          cp -f "$BIN" "openwrt/out/mimo_desktop_bridge_$ARCH_LABEL"
          docker run --rm -v "$PWD:/w" -w /w \
            "ghcr.io/cross-rs/$TARGET:main" \
            "$STRIP_TOOL" "openwrt/out/mimo_desktop_bridge_$ARCH_LABEL" \
            || llvm-strip "openwrt/out/mimo_desktop_bridge_$ARCH_LABEL" || true
          file "openwrt/out/mimo_desktop_bridge_$ARCH_LABEL" || true

      - name: Pack deployable bundle
        run: |
          set -euo pipefail
          NAME="mimo_desktop_bridge_${GITHUB_REF_NAME}_openwrt_${ARCH_LABEL}.tar.gz"
          echo "BUNDLE=$NAME" >> "$GITHUB_ENV"
          bash openwrt/pack-bundle.sh \
            "openwrt/out/mimo_desktop_bridge_$ARCH_LABEL" \
            "openwrt/out/$NAME"

      # apk-tools v3 (`apk mkpkg`) for OpenWrt 25.12+. Build from Alpine's
      # GitHub mirror; pin commit and verify archive.
      - name: Install apk-tools (mkpkg)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl meson ninja-build libssl-dev zlib1g-dev pkg-config fakeroot
          apk_tools_dir="$(mktemp -d)"
          apk_tools_commit="522171e05c72c8a0dd2a9392f053c89196fbdb9b"
          apk_tools_sha256="4dc7051b7255829eeba77a68a8422889e6e98ffe2cfef50a2a47ef8c0973968c"
          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 180 \
            "https://github.com/alpinelinux/apk-tools/archive/${apk_tools_commit}.tar.gz" \
            -o "$apk_tools_dir/apk-tools.tar.gz"
          echo "$apk_tools_sha256  $apk_tools_dir/apk-tools.tar.gz" | sha256sum -c -
          mkdir "$apk_tools_dir/source"
          tar -xzf "$apk_tools_dir/apk-tools.tar.gz" \
            --strip-components=1 \
            -C "$apk_tools_dir/source"
          meson setup "$apk_tools_dir/build" "$apk_tools_dir/source" \
            -Dminimal=false \
            -Dhelp=disabled \
            -Ddocs=disabled \
            -Dlua=disabled \
            -Dpython=disabled \
            -Dtests=disabled \
            --prefix=/usr/local
          ninja -C "$apk_tools_dir/build"
          sudo ninja -C "$apk_tools_dir/build" install
          sudo ldconfig
          apk --version
          out="$(apk mkpkg 2>&1 || true)"
          echo "$out" | grep -q "required info field"

      - name: Build opkg ipk + apk
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then
            ver="0.0.0_git$(git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          fi
          IPK="luci-app-mimo-desktop-bridge_${ver}-1_${PKG_ARCH}.ipk"
          APK="luci-app-mimo-desktop-bridge-${ver}-r1_${ARCH_LABEL}.apk"
          echo "IPK=$IPK" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
          PKG_VERSION="$ver" PKG_ARCH="$PKG_ARCH" \
            bash openwrt/build-ipk.sh \
              "openwrt/out/mimo_desktop_bridge_$ARCH_LABEL" \
              "openwrt/out/$IPK"
          PKG_VERSION="$ver" PKG_RELEASE=1 PKG_ARCH="$PKG_ARCH" \
            bash openwrt/build-apk.sh \
              "openwrt/out/mimo_desktop_bridge_$ARCH_LABEL" \
              "openwrt/out/$APK"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.label }}
          path: |
            openwrt/out/${{ env.BUNDLE }}
            openwrt/out/${{ env.IPK }}
            openwrt/out/${{ env.APK }}
          if-no-files-found: error

  # ── One shot publish: gather every artifact, release is NOT a draft. ──
  publish:
    name: Publish release
    needs: [build, openwrt]
    # Only real tags publish; workflow_dispatch stays a dry run.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute date version
        id: ver
        run: echo "date=$(TZ=Asia/Shanghai date +'%y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Create published release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mimo_desktop_bridge ${{ github.ref_name }} (${{ steps.ver.outputs.date }})"
          body: |
            Headless server binary (WebUI + OpenAI/Anthropic/Responses compat).

            Assets: platform binaries (macOS universal, Windows x64/arm64, Linux x64/arm64)
            plus OpenWrt LuCI bundles — deployable tar.gz, opkg `.ipk` (24.10),
            and apk `.apk` (25.12+) for aarch64 and x86_64.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*
